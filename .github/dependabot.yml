version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-android)"
    labels:
      - "dependencies"
      - "android"

  - package-ecosystem: "npm"
    directory: "/fuelcompare-backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-backend)"
    labels:
      - "dependencies"
      - "backend"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "America/Sao_Paulo"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"

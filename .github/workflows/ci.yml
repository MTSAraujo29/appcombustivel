name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuelcompare-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: fuelcompare-backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificação de tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high

  android:
    name: Android (Kotlin/Compose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Permitir execução do wrapper
        run: chmod +x gradlew

      - name: Testes unitários
        run: ./gradlew :core:network:test :domain:test :data:testDebugUnitTest --stacktrace

      - name: Build debug e release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Publicar relatórios e APK de debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
            core/network/build/reports/tests/test/
            domain/build/reports/tests/test/
            data/build/reports/tests/testDebugUnitTest/
